<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Google Token Test — Store & App</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    h2 {
      margin-top: 0;
    }

    #token-box {
      margin-top: 20px;
      display: none;
    }

    textarea {
      width: 100%;
      height: 120px;
      font-size: 11px;
      font-family: monospace;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
      box-sizing: border-box;
    }

    button.copy-btn {
      margin-top: 8px;
      padding: 8px 20px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button.copy-btn:hover {
      background: #1558b0;
    }

    .label {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }

    select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 8px;
    }
    .badge-store { background: #e8f0fe; color: #1a73e8; }
    .badge-app   { background: #fce8e6; color: #d93025; }

    .success {
      color: green;
      font-weight: bold;
      margin-top: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🔑 Google Token Test</h2>
    <p class="label">Select which auth flow to test, then sign in with Google.<br />The token will be sent to the correct endpoint automatically.</p>

    <select id="auth-target">
      <option value="store">🛍️ Store — /api/website/google-auth</option>
      <option value="app">☕ App — /api/app/google-auth</option>
    </select>

    <!-- App client ID -->
    <div id="g_id_onload"
      data-client_id="877303464646-cv6uvi3n5vrutv060g715oh6b3cd8rek.apps.googleusercontent.com"
      data-callback="onGoogleToken"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>

    <div id="token-box">
      <p class="label" style="margin-top:16px">✅ Token received!</p>
      <p id="endpoint-label" class="label" style="margin:0 0 8px"></p>
      <textarea id="token-output" readonly></textarea>
      <button class="copy-btn" onclick="copyToken()">📋 Copy Token</button>
      <p id="copy-confirm" class="success" style="display:none">Copied to clipboard!</p>
      <p id="api-result" class="label" style="margin-top:12px;word-break:break-all"></p>
    </div>
  </div>

  <script>
    async function onGoogleToken(response) {
      const token = response.credential;
      const target = document.getElementById('auth-target').value;
      const endpoint = target === 'app' ? '/api/app/google-auth' : '/api/website/google-auth';

      console.log('TARGET:', target);
      console.log('ENDPOINT:', endpoint);
      console.log('TOKEN:', token);

      const box = document.getElementById('token-box');
      const output = document.getElementById('token-output');
      const label = document.getElementById('endpoint-label');
      const result = document.getElementById('api-result');

      box.style.display = 'block';
      output.value = token;
      label.innerHTML = `Sending to <strong>${endpoint}</strong>…`;
      result.textContent = '';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ googleToken: token }),
          credentials: 'include',
        });
        const data = await res.json();
        console.log('RESPONSE:', data);
        result.textContent = `Status ${res.status}: ${JSON.stringify(data, null, 2)}`;
        result.style.color = res.ok ? 'green' : '#d93025';
      } catch (err) {
        result.textContent = 'Fetch error: ' + err.message;
        result.style.color = '#d93025';
      }
    }

    function copyToken() {
      const output = document.getElementById('token-output');
      navigator.clipboard.writeText(output.value).then(() => {
        const confirm = document.getElementById('copy-confirm');
        confirm.style.display = 'block';
        setTimeout(() => confirm.style.display = 'none', 2000);
      });
    }
  </script>
</body>

</html>
